spring.application.name=sales-management

jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000
spring.flyway.out-of-order=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

epod.upload-dir=./epod-uploads
epod.storage-dir=./epod-storage

#company coordinates
company.latitude=33.360570
company.longitude=36.225641

# CORS: origins allowed to call this API (comma-separated).
# Override per environment; SecurityConfig requires it at startup.
client.origin=http://localhost:4200
