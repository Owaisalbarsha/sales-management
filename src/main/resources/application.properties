spring.application.name=sales-management

jwt.secret=${JWT_SECRET}
jwt.access-token-expiry-ms=900000
jwt.refresh-token-expiry-ms=604800000
spring.flyway.out-of-order=true
# Tolerate migrations that exist in a database's history but no longer in the repo.
# V2__seed_admin_user.sql and the old R__seed_demo_data.sql were both deleted after they had
# already been applied to sm_test, the dev database and Neon; without this, Flyway fails
# validation on every one of them and the application refuses to start.
spring.flyway.ignore-migration-patterns=*:missing

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

epod.upload-dir=./epod-uploads
epod.storage-dir=./epod-storage

#company coordinates
company.latitude=33.360570
company.longitude=36.225641

# CORS: origins allowed to call this API (comma-separated).
# Override per environment; SecurityConfig requires it at startup.
client.origin=https://sales-mangment.vercel.app

# Demo data seeding: a rolling 60-day window of history ending today.
# This is a demo system, so it is on by default and runs on every
# environment except the test profile. Contributors are idempotent — a re-deploy over an
# already-seeded database creates nothing. Set to false to switch it off for a deployment.
app.seed.enabled=true
