# src/test/resources/application-test.yml
#
# Test profile for the tracking module (and any later module that needs real SQL).
#
# WHY A REAL POSTGRESQL AND NOT H2
# The live-map query uses DISTINCT ON, which is PostgreSQL-specific and unimplemented in
# every embedded database. The dedup tests depend on how TIMESTAMPTZ rounds, and the
# projection tests depend on how NUMERIC(9,6) binds. Under H2 the interesting half of the
# suite would either fail for the wrong reason or silently pass against different semantics.
# Testing against a different database than production is testing a different application.
#
# SETUP (no Docker required)
#   createdb sm_test
# Flyway migrates it from empty on the first run, so it never needs manual schema work.
# Use a throwaway database: TrackingServiceTest truncates gps_logs between tests.
#
# ALTERNATIVE
# If Docker is available, Testcontainers is the better answer because it needs no local
# setup and cannot drift from production's PostgreSQL version:
#   @Testcontainers + @Container PostgreSQLContainer<>("postgres:16-alpine")
#   with @ServiceConnection, which wires the datasource with no properties at all.
#   https://docs.spring.io/spring-boot/reference/testing/testcontainers.html

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sm_test
    username: postgres
    password: PostgreSQL
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema, in tests exactly as in production. Letting Hibernate
      # generate it would test a schema no deployment will ever run, and would quietly
      # mask a broken migration.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # db/seeder provides the demo users (ids 1-11) that TrackingServiceTest and others assume
    # already exist (gps_logs.representative_id is FK-constrained to users). Matches production's
    # spring.flyway.locations so a freshly created sm_test database needs no manual seeding.
    #locations: classpath:db/migration,classpath:db/seeder

logging:
  level:
    # Uncomment when a dedup test fails and the reason is not obvious: seeing the actual
    # bind values is usually enough to spot a precision mismatch.
    # org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.SQL: INFO

# The JWT filter reads jwt.secret at bean-creation time, so ANY @SpringBootTest fails to start a
# context without one — including tests that never authenticate. Production takes it from the
# JWT_SECRET environment variable; a test must not depend on a developer's shell, so a fixed
# throwaway key lives here. It is a test key by construction: it signs nothing that leaves the
# suite, and it is deliberately not the value any deployment uses.
jwt:
  secret: test-only-secret-not-used-anywhere-else-32b+

# Firebase push is off in tests: enabling it would have the context reach for a service-account
# JSON on the developer's disk and fail everywhere it is absent.
notification:
  fcm:
    enabled: false

# SecurityConfig reads client.origin at bean-creation time (CORS allowed origins), so ANY
# @SpringBootTest fails to start a context without it, same as jwt.secret above. No real client
# talks to the test context, so the value itself is arbitrary.
client:
  origin: http://localhost:4200
